[tools]
rust = "nightly"

[env]
AOC_SAVE_DIR = "input"

_.file = '.env'
_.python.venv = ".venv"

[tasks.run]
description = "AoC solution runner"
usage = '''
arg "<language>" help="Language to run" {
  choices "rust" "zig" "ocaml"
}
flag "-y --year <year>" help="Year to run"
flag "-d --day <day>" help="Day to run"
flag "-p --part <part>" help="Part to run" default="1" {
  choices "1" "2"
}
flag "-I --input-file <input-file>" help="Input file path"
flag "-a --auto-download" help="Automatically download input if missing" default=#true negate="--no-auto-download"
flag "-t --test <test>" help="Run with test input"
flag "-f --fast" help="Run optimised code"
'''
run = '''
#!/usr/bin/env sh
set -e

CURRENT_YEAR=$(date +%Y)
CURRENT_DAY=$(date +%d | sed 's/^0*//')

LANGUAGE="${usage_language?}"
YEAR="${usage_year:-$CURRENT_YEAR}"
DAY="${usage_day:-$CURRENT_DAY}"
PART="${usage_part:-1}"
INPUT_FILE="${usage_input_file:-}"
AUTO_DOWNLOAD="${usage_auto_download:-true}"
TEST="${usage_test:-0}"
FAST="${usage_fast:-false}"

# Pad day for filename formatting
DAY_PADDED=$(printf "%02d" "$DAY")

# Determine input file path
get_input_file() {
  if [ -n "$INPUT_FILE" ]; then
    echo "$INPUT_FILE"
    return
  fi

  if [ "$TEST" != "0" ]; then
    echo "input/${YEAR}_${DAY_PADDED}_${TEST}.test.txt"
  else
    echo "input/${YEAR}_${DAY_PADDED}.txt"
  fi
}

# Check if stdin is piped
if [ -t 0 ]; then
  # No piped input, need to read from file
  RESOLVED_INPUT_FILE=$(get_input_file)

  # Check if file exists, auto-download if needed
  if [ ! -f "$RESOLVED_INPUT_FILE" ]; then
    if [ "$AUTO_DOWNLOAD" = "true" ]; then
      echo "Downloading input for year $YEAR, day $DAY"
      mise run scrape --year "$YEAR" --day "$DAY" || exit $?
    else
      echo "Error: Input file not found at $RESOLVED_INPUT_FILE" >&2
      echo "Run the scraper first or use --auto-download" >&2
      exit 1
    fi
  fi

  # Check if file exists after potential download
  if [ ! -f "$RESOLVED_INPUT_FILE" ]; then
    echo "Error: Failed to get input file at $RESOLVED_INPUT_FILE" >&2
    exit 1
  fi

  # Run with file input
  INPUT_REDIRECT="< $RESOLVED_INPUT_FILE"
else
  # Piped input
  INPUT_REDIRECT=""
fi

case "$LANGUAGE" in
  rust)
    CMD="cargo run -p aoc-${YEAR}"
    if [ "$FAST" = "true" ]; then
      CMD="$CMD --release"
    fi
    CMD="$CMD -- $DAY $PART"
    ;;

  zig)
    CMD="zig build aoc-${YEAR}-${DAY_PADDED}"
    if [ "$FAST" = "true" ]; then
      CMD="$CMD --release=fast"
    fi
    CMD="$CMD -- $PART"
    ;;

  ocaml)
    CMD="opam exec -- dune exec ${YEAR}/ocaml/day${DAY_PADDED}.exe -- $PART"
    ;;
  *)
    echo "Unknown language: $LANGUAGE" >&2
    exit 1
    ;;
esac

CMD="$CMD $INPUT_REDIRECT"
eval "$CMD"
'''

[tasks.scrape]
description = "AoC question scraper"
usage = '''
flag "-y --year <year>" {
  help "Year to scrape (defaults to current year)"
}
flag "-d --day <day>" {
  help "Day to scrape (defaults to current day)"
}
flag "-s --session-token <session-token>" {
  help "Advent of Code session token, if not provided, will load from .env"
  env "ADVENT_OF_CODE_SESSION"
}
flag "-m --max-retries <max-retries>" {
  help "Maximum number of retries"
  default "3"
}
flag "-D --delay <delay>" {
  help "Delay between retries in seconds"
  default "5"
}
flag "-o --output-dir <output-dir>" {
  help "Output directory for inputs"
  env "AOC_SAVE_DIR"
}
'''
run = '''
#!/usr/bin/env sh
set -e

CURRENT_YEAR=$(date +%Y)
CURRENT_DAY=$(date +%d | sed 's/^0*//')

YEAR=${usage_year:-$CURRENT_YEAR}
DAY=${usage_day:-$CURRENT_DAY}

cargo run -p aoc-scraper --release -- \
  --year "$YEAR" \
  --day "$DAY" \
  --max-retries ${usage_max_retries} \
  --delay ${usage_delay} \
  --output-dir ${usage_output_dir} \
  --session-token ${usage_session_token}
'''
